name: Windows build

on:
  push:
    branches: [halo, windows-port]
  pull_request:
    branches: [halo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web UI
        working-directory: web
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        shell: bash
        run: go mod download

      - name: Validate Windows installer scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Run Windows tests
        shell: bash
        run: go test ./...

      - name: Build Windows executable
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/halo-windows-amd64.exe ./cmd/vocat
          dist/halo-windows-amd64.exe version

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: halo-windows-amd64
          path: |
            dist/halo-windows-amd64.exe
            scripts/windows/install.ps1
            scripts/windows/uninstall.ps1
          if-no-files-found: error
