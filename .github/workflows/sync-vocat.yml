name: sync-vocat

# Poll official VoCat releases. A clean merge bumps Halo, builds and tests it,
# then atomically pushes the branch and tag and calls release-binaries.
# Merge conflicts open a GitHub issue instead of overwriting Halo UI/phone/WG
# customizations. Never pushes to MengMengCode/VoCat.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [vocat-release]

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-vocat
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Nan7Li/VoCat'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      did_sync: ${{ steps.merge.outputs.did_sync }}
      tag: ${{ steps.merge.outputs.tag }}
    steps:
      - name: Checkout Halo
        uses: actions/checkout@v5
        with:
          ref: halo
          fetch-depth: 0

      - name: Merge latest VoCat release
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "halo-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add vocat "https://github.com/MengMengCode/VoCat.git" 2>/dev/null || git remote set-url vocat "https://github.com/MengMengCode/VoCat.git"
          git fetch vocat --tags --force

          latest="$(gh release view --repo MengMengCode/VoCat --json tagName --jq .tagName)"
          latest="${latest#v}"
          if [ -z "$latest" ]; then
            echo "could not read the latest VoCat release"
            exit 1
          fi

          synced=""
          if [ -f .halo/upstream-vocat ]; then
            synced="$(tr -d ' \n' < .halo/upstream-vocat)"
            synced="${synced#v}"
          fi
          echo "VoCat latest=$latest synced=$synced"
          if [ "$latest" = "$synced" ]; then
            echo "already synced"
            echo "did_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch vocat "refs/tags/v${latest}:refs/tags/v${latest}"
          if ! git merge --no-ff --no-commit "v${latest}"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort || true
            title="Vocat v${latest} 无法自动合进 Halo"
            body="$(cat <<EOF
          Official VoCat [v${latest}](https://github.com/MengMengCode/VoCat/releases/tag/v${latest}) is newer than Halo's synced \`v${synced:-unknown}\`, but \`git merge\` hit conflicts.

          Halo keeps its own phone page, recording, ePDG UI, radio triad, WireGuard, and branding. Do not force-overwrite those files.

          Conflicted files:

          \`\`\`
          ${conflicts}
          \`\`\`

          Next step: merge \`v${latest}\` into the \`halo\` branch locally, resolve conflicts, then tag a Halo release. The router can pick that up with automatic install.
          EOF
          )"
            if [ "$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled --jq .hasIssuesEnabled)" = "true" ]; then
              if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q '[0-9]'; then
                gh issue create --title "$title" --body "$body" || echo "::warning::$title"
              fi
            else
              {
                echo "## $title"
                echo
                echo "$body"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$title（仓库 Issues 已关闭，详情已写入任务摘要）"
            fi
            echo "did_sync=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          current="$(sed -n 's/^var Version = "\([0-9.]*\)"/\1/p' internal/buildinfo/buildinfo.go | head -n1)"
          if [ -z "$current" ]; then
            echo "could not read Halo version"
            exit 1
          fi
          IFS=. read -r major minor patch <<EOF
          $current
          EOF
          patch=$((patch + 1))
          new="${major}.${minor}.${patch}"

          mkdir -p .halo
          printf '%s\n' "$latest" > .halo/upstream-vocat
          sed -i "s/defaultUpstreamVocatVersion = \"[^\"]*\"/defaultUpstreamVocatVersion = \"${latest}\"/" internal/server/upstream_vocat.go
          export HALO_CURRENT="$current"
          export HALO_NEW="$new"
          export VOCAT_LATEST="$latest"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          current = os.environ["HALO_CURRENT"]
          new = os.environ["HALO_NEW"]
          latest = os.environ["VOCAT_LATEST"]

          def replace_once(path_name, pattern, replacement):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"expected exactly one version marker in {path_name}: {pattern}")
              path.write_text(updated, encoding="utf-8")

          replace_once(
              "ATTRIBUTION.md",
              rf"^Halo {re.escape(current)} is a personal interface and release\. It is \*\*based on VoCat\*\*\.$",
              f"Halo {new} is a personal interface and release. It is **based on VoCat**.",
          )
          replace_once(
              "ATTRIBUTION.md",
              r"^- Synced through:.*$",
              f"- Synced through: VoCat v{latest}",
          )
          replace_once(
              "ATTRIBUTION.md",
              r"^Everything else —.*$",
              f"Everything else — modem control, IMS / WiFi Calling, SMS, eSIM, proxy, notifications — comes from VoCat. Halo {new} includes upstream changes through VoCat v{latest}.",
          )
          replace_once(
              "README.md",
              rf"^> \*\*Halo {re.escape(current)}\*\* is a personal interface and release based on.*$",
              f"> **Halo {new}** is a personal interface and release based on [VoCat](https://github.com/MengMengCode/VoCat) v{latest} by the Vocat Project Authors. The modem, IMS, WiFi Calling, eSIM, and proxy stack is their work. This branch only adds a different UI, Halo branding, a customizable accent color, and a few local fixes. The [Vocat Research & Evaluation License](LICENSE) still applies. See [ATTRIBUTION.md](ATTRIBUTION.md).",
          )
          replace_once(
              "docs/README.zh-CN.md",
              rf"^> \*\*Halo {re.escape(current)}\*\* 是基于.*$",
              f"> **Halo {new}** 是基于 [VoCat](https://github.com/MengMengCode/VoCat) v{latest} 的个人界面与发行版，原作者为 Vocat Project Authors。模组、IMS、WiFi Calling、eSIM 和代理等核心能力都是原项目的工作。本分支只改了界面、Halo 品牌、可自定义主色，以及少量本地修复。仍适用 [Vocat Research & Evaluation License](../LICENSE)。详见 [ATTRIBUTION.md](../ATTRIBUTION.md)。",
          )
          PY
          sed -i "s/var Version = \"${current}\"/var Version = \"${new}\"/" internal/buildinfo/buildinfo.go

          git add -A
          if git diff --cached --quiet; then
            echo "merge produced no file changes"
            echo "did_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync VoCat v${latest} into Halo ${new}"
          git tag -a "v${new}" -m "Halo ${new}: sync VoCat v${latest}"
          echo "did_sync=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${new}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.merge.outputs.did_sync == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web UI
        if: steps.merge.outputs.did_sync == 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Go
        if: steps.merge.outputs.did_sync == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test merged Halo
        if: steps.merge.outputs.did_sync == 'true'
        run: go test ./...

      - name: Build router smoke artifact
        if: steps.merge.outputs.did_sync == 'true'
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -o /tmp/halo-linux-aarch64 ./cmd/vocat

      - name: Publish verified sync
        if: steps.merge.outputs.did_sync == 'true'
        env:
          RELEASE_TAG: ${{ steps.merge.outputs.tag }}
        run: git push --atomic origin HEAD:halo "refs/tags/${RELEASE_TAG}"

  release:
    needs: sync
    if: needs.sync.outputs.did_sync == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.sync.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
