name: release-binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag such as v1.1.8"
        required: true
        type: string

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Upload embedded web UI
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  test:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download embedded web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Test
        run: go test ./...

  binaries:
    needs: [web, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ""
            filename: vocat-linux-amd64
          - target: linux-386
            goos: linux
            goarch: "386"
            goarm: ""
            filename: vocat-linux-386
          - target: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ""
            filename: vocat-linux-arm64
          - target: linux-aarch64
            goos: linux
            goarch: arm64
            goarm: ""
            filename: vocat-linux-aarch64
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            filename: vocat-linux-armv7
          - target: windows-amd64
            goos: windows
            goarch: amd64
            goarm: ""
            filename: vocat-windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download embedded web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Set up QEMU for ARM64 runtime smoke test
        if: matrix.goarch == 'arm64'
        uses: docker/setup-qemu-action@v3
      - name: Build ${{ matrix.target }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          OUTPUT: dist/${{ matrix.filename }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          VERSION="${VERSION#v}"
          BUILD_TIME="$(git show -s --format=%cI HEAD)"
          go build -trimpath \
            -ldflags "-s -w -X vocat/internal/buildinfo.Version=${VERSION} -X vocat/internal/buildinfo.BuildTime=${BUILD_TIME}" \
            -o "$OUTPUT" \
            ./cmd/vocat
          if [[ "${{ matrix.target }}" == "windows-amd64" ]]; then
            WINTUN_VERSION="0.14.1"
            WINTUN_URL="https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip"
            curl --fail --location --silent --show-error "$WINTUN_URL" -o /tmp/wintun.zip
            echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  /tmp/wintun.zip" | sha256sum --check --status
            unzip -p /tmp/wintun.zip wintun/bin/amd64/wintun.dll > dist/wintun.dll
            test -s dist/wintun.dll
          fi
          if [[ "${{ matrix.target }}" == linux-* ]]; then
            chmod 0755 "$OUTPUT"
            if readelf -l "$OUTPUT" | grep -q 'Requesting program interpreter'; then
              echo "ERROR: $OUTPUT unexpectedly requires a dynamic loader" >&2
              readelf -l "$OUTPUT" >&2
              exit 1
            fi
            case "${{ matrix.goarch }}" in
              amd64|arm64) "$OUTPUT" version ;;
            esac
          fi
      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 1
      - name: Upload signed Wintun runtime
        if: matrix.target == 'windows-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows-wintun
          path: dist/wintun.dll
          if-no-files-found: error
          retention-days: 1

  github-release:
    if: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
    needs: binaries
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          for f in vocat-linux-*; do
            cp "$f" "halo-${f#vocat-}"
          done
          for f in vocat-windows-*; do
            cp "$f" "halo-${f#vocat-}"
          done
          sha256sum vocat-linux-* halo-linux-* vocat-windows-* halo-windows-* wintun.dll | sort > SHA256SUMS
      - name: Create or update GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
