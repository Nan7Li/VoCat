name: publish-current-halo

on:
  push:
    branches:
      - halo
    paths:
      - ".github/workflows/publish-current-halo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      publish: ${{ steps.prepare.outputs.publish }}
    steps:
      - name: Checkout Halo
        uses: actions/checkout@v5
        with:
          ref: halo
          fetch-depth: 0

      - name: Prepare current Halo tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^var Version = "\([0-9.]*\)"/\1/p' internal/buildinfo/buildinfo.go | head -n1)"
          if [ -z "$current" ]; then
            echo "could not read Halo version" >&2
            exit 1
          fi
          tag="v${current}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "halo-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            echo "using existing tag $tag"
          else
            git tag -a "$tag" -m "Halo ${current}"
            git push origin "$tag"
            echo "created tag $tag"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
